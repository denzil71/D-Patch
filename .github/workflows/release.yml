# Builds and publishes a GitHub release when a version tag such as v1.2.3 is pushed.
# The tag must match VERSION in build.sh. Release notes are the annotated tag's message (if any),
# then GitHub's generated list of changes, then the install instructions (.github/release-footer.md,
# or release-footer-notarized.md once the Developer ID secrets are set).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the tag's message
        # checkout fetches the tagged commit, not the annotated tag object.
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Check the tag matches build.sh
        run: |
          VERSION=$(sed -nE 's/^VERSION="([^"]+)"$/\1/p' build.sh)
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION=\"$VERSION\" in build.sh. Bump VERSION (and BUILD_NUMBER) first."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: ./test.sh
      - name: Set up Developer ID signing
        # Skipped (and the release is signed ad hoc) until the repository has these secrets:
        # DEVELOPER_ID_P12 (the Developer ID Application certificate and key, .p12, base64),
        # DEVELOPER_ID_P12_PASSWORD, and an App Store Connect API key for notarization:
        # NOTARY_KEY_P8 (the .p8 file's contents), NOTARY_KEY_ID and NOTARY_ISSUER_ID.
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::No DEVELOPER_ID_P12 secret: this release is signed ad hoc and not notarized."
            exit 0
          fi
          if [[ -z "$NOTARY_KEY_P8" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "::error::DEVELOPER_ID_P12 is set but the NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER_ID secrets are not all set."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::DEVELOPER_ID_P12 holds no Developer ID Application identity."
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
            echo "NOTARIZED=1"
          } >> "$GITHUB_ENV"
      - name: Build
        run: ./build.sh --dmg
      - name: Check the app
        run: |
          codesign -v build/D-Patch.app
          test "$(lipo -archs build/D-Patch.app/Contents/MacOS/DPatch)" = "arm64"
          if [[ "${NOTARIZED:-}" == 1 ]]; then
            spctl --assess --type execute -v build/D-Patch.app
            xcrun stapler validate build/D-Patch.app
            xcrun stapler validate "dist/D-Patch-$VERSION.dmg"
          fi
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/D-Patch-$VERSION.dmg"
          SHA=$(shasum -a 256 "$DMG" | cut -d' ' -f1)
          {
            if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == "tag" ]]; then
              git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME"
              echo
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -q .body
            echo
            echo
            FOOTER=.github/release-footer.md
            [[ "${NOTARIZED:-}" == 1 ]] && FOOTER=.github/release-footer-notarized.md
            sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$SHA/g" "$FOOTER"
          } > release-notes.md
          cat release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/D-Patch-$VERSION.dmg" \
            --title "D-Patch $VERSION" --notes-file release-notes.md --verify-tag
